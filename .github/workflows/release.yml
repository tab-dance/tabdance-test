name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and release binaries
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with ghostty submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          # This runner is Linux and has no Apple SDK, so the darwin targets
          # link the stub .tbd files in scripts/macos-stubs.
          TT_DARWIN_EXTRA_LDFLAGS: -L ${{ github.workspace }}/scripts/macos-stubs -F ${{ github.workspace }}/scripts/macos-stubs
