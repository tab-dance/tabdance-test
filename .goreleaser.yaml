version: 2

project_name: tabdance-test

builds:
  - id: tabdance-test
    main: ./cmd/tt
    binary: tt
    ldflags:
      - -s -w -X github.com/tab-dance/tabdance-test/internal/version.Version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
      # Absolute path is required: cgo runs pkg-config from the
      # go.mitchellh.com/libghostty module directory, so relative
      # PKG_CONFIG_PATH entries are not resolved.
      - PKG_CONFIG_PATH={{ .Env.GITHUB_WORKSPACE }}/dist/lib/{{ .Target }}/share/pkgconfig
    hooks:
      pre:
        - cmd: ./scripts/build-lib.sh {{ .Target }}
          output: true
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CC=zig cc -target x86_64-linux-gnu
      - goos: linux
        goarch: arm64
        env:
          - CC=zig cc -target aarch64-linux-gnu
      # The stub framework paths live in TT_DARWIN_EXTRA_LDFLAGS so they are
      # only applied by a Linux-hosted cross build. On a macOS host the real
      # SDK frameworks are linked instead: passing the stubs there resolves
      # each -framework to two different files, producing duplicate dylib
      # load commands that dyld rejects with exit code 134.
      - goos: darwin
        goarch: amd64
        env:
          - CC=zig cc -target x86_64-macos
        ldflags:
          - -s -w -X github.com/tab-dance/tabdance-test/internal/version.Version={{ .Version }}
            -extldflags "{{ .Env.TT_DARWIN_EXTRA_LDFLAGS }}"
      - goos: darwin
        goarch: arm64
        env:
          - CC=zig cc -target aarch64-macos
        ldflags:
          - -s -w -X github.com/tab-dance/tabdance-test/internal/version.Version={{ .Version }}
            -extldflags "{{ .Env.TT_DARWIN_EXTRA_LDFLAGS }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

aurs:
  -
    description: "Headless terminal testing"
    homepage: "https://github.com/tab-dance/tabdance-test"
    license: "custom"
    maintainers:
      - rsteube <rsteube@users.noreply.github.com>
    private_key: '{{ .Env.AUR_KEY }}'
    git_url: 'ssh://aur@aur.archlinux.org/tabdance-test-bin.git'

changelog:
  use: github

release:
  draft: true
