version: 2

project_name: tabdance-test

builds:
  - id: tabdance-test
    main: ./cmd/tt
    binary: tt
    ldflags:
      - -s -w -X github.com/tab-dance/tabdance-test/internal/version.Version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
      # Absolute path is required: cgo runs pkg-config from the
      # go.mitchellh.com/libghostty module directory, so relative
      # PKG_CONFIG_PATH entries are not resolved.
      - PKG_CONFIG_PATH={{ .Env.GITHUB_WORKSPACE }}/dist/lib/{{ .Target }}/lib/pkgconfig
    hooks:
      pre:
        - cmd: ./scripts/build-lib.sh {{ .Target }}
          output: true
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CC=zig cc -target x86_64-linux-gnu
      - goos: linux
        goarch: arm64
        env:
          - CC=zig cc -target aarch64-linux-gnu
      # The darwin targets use the stub .tbd files (no Apple SDK is available
      # to the zig toolchain) and the zig-cc-darwin.sh wrapper, which drops the
      # repeated "-framework CoreFoundation" the Go toolchain passes: the
      # Mach-O linker would otherwise emit a second dylib load command and dyld
      # refuses to load it.
      - goos: darwin
        goarch: amd64
        env:
          - CC={{ .Env.GITHUB_WORKSPACE }}/scripts/zig-cc-darwin.sh x86_64-macos
        ldflags:
          - -s -w -X github.com/tab-dance/tabdance-test/internal/version.Version={{ .Version }}
            -extldflags "-L {{ .Env.GITHUB_WORKSPACE }}/scripts/macos-stubs -F {{ .Env.GITHUB_WORKSPACE }}/scripts/macos-stubs"
      - goos: darwin
        goarch: arm64
        env:
          - CC={{ .Env.GITHUB_WORKSPACE }}/scripts/zig-cc-darwin.sh aarch64-macos
        ldflags:
          - -s -w -X github.com/tab-dance/tabdance-test/internal/version.Version={{ .Version }}
            -extldflags "-L {{ .Env.GITHUB_WORKSPACE }}/scripts/macos-stubs -F {{ .Env.GITHUB_WORKSPACE }}/scripts/macos-stubs"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

aurs:
  -
    description: "Headless terminal testing"
    homepage: "https://github.com/tab-dance/tabdance-test"
    license: "custom"
    maintainers:
      - rsteube <rsteube@users.noreply.github.com>
    private_key: '{{ .Env.AUR_KEY }}'
    git_url: 'ssh://aur@aur.archlinux.org/tabdance-test-bin.git'

changelog:
  use: github

release:
  draft: true
